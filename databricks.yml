# CUSTOMER DEPLOYMENT CHECKLIST
# -----------------------------
# Supply these three workspace-specific variables before validation/deployment:
#   catalog, warehouse_id, slack_notification_destination_id
# Pass them with `--var`, or set them under the target's `variables` block below.
# Keep the Slack incoming-webhook URL out of this file; store it in the secret
# scope/key named by hook_secret_scope and hook_secret_key.
#
# The remaining defaults are demo-safe names and can be changed to match your
# naming standards, source mirror, or data-retention conventions.
bundle:
  name: nyc_taxi_pipeline_monitoring
  # CUSTOMER CHANGE POINT: generate a new UUID only if this fork must coexist as
  # a distinct bundle with another copy of the demo in the same workspace/target.
  uuid: 43cb59ce-b49a-480d-aa54-63c9026c2f16

include:
  - resources/*.yml

variables:
  # CUSTOMER CHANGE POINT: optional prefix displayed on the Job, pipeline, and dashboard.
  resource_name_prefix:
    description: Optional target-specific prefix used to keep development-mode resources unique.
    default: ""

  # CUSTOMER CHANGE POINT (required): an existing Unity Catalog catalog in this workspace.
  # This has no fallback so a missing override fails safely before resource creation.
  catalog:
    description: Unity Catalog catalog containing source and output data.
  # These schemas and volumes are created and managed by the bundle.
  target_schema:
    description: Isolated schema owned by the development SDP deployment.
    default: nyc_taxi_operations_sdp
  landing_schema:
    description: Bundle-managed schema containing the TLC landing volume.
    default: nyc_taxi_landing
  landing_volume:
    description: Bundle-managed volume for downloaded Yellow Taxi source assets.
    default: tlc_landing
  source_year:
    description: TLC Yellow Taxi source year loaded by the bootstrap task.
    default: "2025"
  source_month_count:
    description: Number of monthly Parquet files expected for the source year.
    default: "12"
  tlc_source_base_url:
    description: HTTPS base URL or internal mirror containing monthly Yellow Taxi Parquet files.
    default: https://d37ci6vzurychx.cloudfront.net/trip-data
  metadata_volume:
    description: Dedicated volume for Auto Loader schema metadata.
    default: nyc_taxi_pipeline_metadata

  # CUSTOMER CHANGE POINT (required): copy the UUID from a workspace notification
  # destination configured for Slack. This is used by the Job, not by the SDP hook.
  slack_notification_destination_id:
    description: Existing Databricks Slack notification destination for Job lifecycle events.

  # CUSTOMER CHANGE POINT (required): ID of the SQL warehouse used by the dashboard.
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard.

  # Set true only after creating the separate incoming-webhook secret described below.
  hook_enabled:
    description: Whether the SDP event hook posts granular events to its secret-backed webhook.
    default: "false"

  # CUSTOMER CHANGE POINT: these are secret identifiers, never the webhook value.
  hook_secret_scope:
    description: Secret scope containing the direct Slack incoming-webhook URL.
    default: nyc-taxi-monitoring
  hook_secret_key:
    description: Secret key containing the direct Slack incoming-webhook URL.
    default: slack-webhook-url

  # Alert-drill controls. Leave these defaults unchanged for normal runs.
  demo_failure_mode:
    description: Set to expectation temporarily to verify failure notifications.
    default: none
  demo_test_run_id:
    description: Optional correlation label included in the reversible alert drill.
    default: normal

targets:
  # Development mode prefixes resources/schemas with the deploying user's identity.
  # CUSTOMER CHANGE POINT: add your required variables here if your team prefers
  # checked-in, non-secret environment configuration over repeated `--var` flags.
  dev:
    default: true
    mode: development
    variables:
      target_schema: nyc_taxi_operations_sdp
      hook_enabled: "false"
